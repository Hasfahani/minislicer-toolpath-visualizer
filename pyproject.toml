[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minislicer-toolpath-visualizer"
version = "0.2.0"
description = "Educational 2D slicer-style toolpath visualizer built with Streamlit and Shapely"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MiniSlicer Maintainers" }
]
dependencies = [
  "streamlit>=1.57.0",
  "shapely>=2.0.4",
  "numpy>=1.26.0",
  "plotly>=5.22.0",
  "pandas>=2.2.0",
  "trimesh>=4.5.0",
  "scipy>=1.14.0",
  "networkx>=3.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
