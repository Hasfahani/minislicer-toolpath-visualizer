# Purpose: Defines a local Docker Compose service for running MiniSlicer on port 8501.
# Reason: Compose gives a one-command way to build, launch, and health-check the app.
services:
  minislicer:
    build: .
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
